[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machiningpro-ai"
version = "0.1.0"
description = "MachiningPro AI - deterministic-first machining engineering platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MachiningPro AI" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.10,<0.12",
    "Pillow>=10.4,<12",
    "pytesseract>=0.3.13,<0.4",
    "ortools>=9.10,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
